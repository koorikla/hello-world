# PR checks from the platform: go vet/lint/test, govulncheck, CodeQL, OpenChoreo manifests. The image is built,
# signed and deployed by the platform (deploy/openchoreo/component.yaml spec.workflow), not here.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: koorikla/platform/.github/workflows/app-go.yaml@dbc84fdac05465879a03165ca883f2170a50e508 # koorikla/platform#366 (ci-v1.2.0 once released)
    with:
      build_container: false
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: write     # these three are unused with build_container: false, but GitHub checks nested jobs'
      id-token: write     # permissions statically, so the caller must grant them
      attestations: write
