# development: no releaseName, OpenChoreo moves it to every new build (Component autoDeploy).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: hello-world-development
spec:
  owner:
    projectName: demo
    componentName: hello-world
  environment: development
  componentTypeEnvironmentConfigs:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from development
