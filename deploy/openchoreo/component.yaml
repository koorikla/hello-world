# The OpenChoreo Component: what hello-world is and how it is built (README "Files").
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: hello-world
  annotations:
    openchoreo.dev/display-name: Hello World
    openchoreo.dev/description: Tiny Go HTTP service used to exercise the platform end to end
    platform.koorikla.io/preview-environments: enabled # one environment per open pull request
spec:
  owner:
    projectName: demo
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true # each new build goes to development; staging and production move by PR (release-bindings/)
  autoBuild: true  # the platform builds every commit on main with spec.workflow
  traits:
    - kind: ClusterTrait
      name: health-probes # production requires the readiness probe
      instanceName: probes
      parameters:
        readiness: { enabled: true, handler: { httpGet: { port: 8080, path: /healthz } }, periodSeconds: 5 }
        liveness: { enabled: true, handler: { httpGet: { port: 8080, path: /healthz } }, periodSeconds: 10, failureThreshold: 3 }
        startup: { enabled: true, handler: { httpGet: { port: 8080, path: /healthz } }, periodSeconds: 2, failureThreshold: 15 }
    - kind: ClusterTrait
      name: keda-scaler
      instanceName: scaler
      parameters:
        minReplicas: 1
        maxReplicas: 3
        triggers: # demo: 2 replicas from minute 0 to 5 of every 20 (UTC)
          - type: cron
            metadata: { timezone: Etc/UTC, start: "*/20 * * * *", end: "5-59/20 * * * *", desiredReplicas: "2" }
  workflow:
    kind: ClusterWorkflow
    name: go # test, multi-arch image, scan, sign, then commit the image digest into workload.yaml
    parameters:
      repository:
        url: https://github.com/koorikla/hello-world.git
        revision: { branch: main }
        appPath: "."
      docker: { context: ".", filePath: Dockerfile }
      platforms: linux/amd64,linux/arm64
